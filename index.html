<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERVECTAR PELIS Y SERIES TV</title>
<style>
:root{
  --bg:#071025;
  --card:#0b1220;
  --muted:#9aa4b2;
  --accent2:#4f46e5;
  --highlight:#ffeb3b;
  --font-size:16px;
}
body{
  font-family:Inter,system-ui;
  background:linear-gradient(180deg,#041025 0%,var(--bg) 100%);
  color:#eef2f7;
  margin:0;
  padding:16px;
  font-size: var(--font-size);
  overflow-x:hidden;
}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
h1{font-size:20px;margin:0;color:var(--highlight);font-weight:900;text-shadow:0 0 6px rgba(255,255,0,0.5);}
input[type=search], select{padding:12px 16px;border-radius:10px;border:1px solid rgba(0,0,0,0.4);background:var(--highlight);color:#000;font-weight:bold;font-size:16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.card{cursor:pointer;border-radius:8px;overflow:hidden;outline:none;transition: transform 0.2s, box-shadow 0.2s;}
.card:hover, .card:focus{transform: scale(1.05); box-shadow:0 8px 20px rgba(255,235,59,0.6);}
.card .img{width:100%;height:220px;object-fit:cover;border-radius:8px;}
.card .title{font-weight:700;font-size:14px;margin-top:4px;}
.card .meta{color:var(--muted);font-size:12px;margin-top:2px;}
.overlay{position: fixed;inset:0;display:none;align-items:center;justify-content:center;background: rgba(0,0,0,0.85);z-index:9998;padding:10px;}
.overlay.show{display:flex;}
.modal{width:100%;max-width:600px;background:#071028;border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:12px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.seasons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.season-btn{flex:0 0 auto;padding:10px 14px;font-size:14px;border:none;border-radius:8px;cursor:pointer;background:#222;color:#fff;outline:none;transition: all 0.2s;}
.season-btn.active{background:var(--highlight); box-shadow: 0 0 12px var(--highlight); transform: scale(1.1);}
.episodes-grid{display:grid;grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));gap:8px;}
.episode-card{background: var(--card);padding:8px;border-radius:8px;text-align:center;outline:none;transition: all 0.2s;}
.episode-card.focused{box-shadow:0 0 12px var(--highlight); transform: scale(1.05);}
.play-btn{margin-top:6px;padding:8px;border:0;border-radius:8px;background: var(--highlight);color:#000;cursor:pointer;width:100%;font-size:14px;transition: all 0.2s;}
.play-btn:hover, .play-btn:focus{background:var(--highlight);color:#000;outline:none;}
#pagination{display:flex;justify-content:center;gap:6px;margin-top:12px;}
#pagination button{padding:10px 14px;border-radius:6px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:14px;}
#pagination button.active{background:var(--highlight);color:#000;}
#pagination button:hover, #pagination button:focus{background:var(--highlight);color:#000;outline:none;}
.seasons::-webkit-scrollbar{display: none;}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="https://i.ibb.co/FnGwW1c/Logo.png" style="height:42px;width:42px;border-radius:50%;object-fit:cover;">
    <div><h1>SUPERVECTAR PELIS Y SERIES</h1></div>
  </div>
  <div class="controls" style="display:flex;gap:8px;flex-wrap:wrap;">
    <input id="search" type="search" placeholder="Buscar..." tabindex="0">
    <select id="filter" tabindex="0">
      <option value="all">Todos</option>
      <option value="movie">Películas</option>
      <option value="series">Series</option>
    </select>
    <select id="genre-filter" tabindex="0">
      <option value="all">Género</option>
      <option value="Acción">Acción</option>
      <option value="Comedia">Comedia</option>
      <option value="Drama">Drama</option>
      <option value="Sci-Fi">Sci-Fi</option>
      <option value="Thriller">Thriller</option>
      <option value="Terror">Terror</option>
    </select>
    <select id="filterYear" style="width:100px" tabindex="0"><option value="">Año</option></select>
  </div>
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="pagination"></div>
</main>

<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div id="modal-title" class="modal-title"></div>
        <div id="modal-sub" style="color:var(--muted);font-size:13px;margin-top:4px"></div>
      </div>
      <div>
        <button id="modal-close" class="close-btn" aria-label="Cerrar modal" tabindex="0">✕</button>
      </div>
    </div>
    <div class="seasons" id="seasons"></div>
    <div class="episodes-grid" id="episodes"></div>
  </div>
</div>

<script>
// ===== Datos =====
const mediaData = [
  { id:'Terrifier3', type:'movie', title:'Terrifier 3', year:2024, genre:'Terror', poster:'https://es.web.img3.acsta.net/r_1920_1080/pictures/23/11/08/08/26/3084799.jpg', link:'https://filemoon.to/d/f234g0c8s0ye/Terrifier_3__2024___Esp_.mkv'},
  { id:'Terrifier2', type:'movie', title:'Terrifier 2', year:2022, genre:'Terror', poster:'https://es.web.img3.acsta.net/r_1920_1080/pictures/22/12/27/12/24/4448854.jpg', link:'https://filemoon.to/d/otitf2ppt4f1/Terrifier_2.mp4'},
  { id:'Terrifier1', type:'movie', title:'Terrifier 1', year:2016, genre:'Terror', poster:'https://es.web.img3.acsta.net/r_1920_1080/pictures/23/05/22/23/33/0283734.png', link:'https://filemoon.to/d/itcjbe3ajf33/Terrifier.mp4'},
  { id:'28añosdespues', type:'movie', title:'28 años despues', year:2025, genre:'Terror', poster:'https://es.web.img3.acsta.net/r_1920_1080/img/5c/f3/5cf309bb27c25dd8a20548e7e6ae9d94.jpg', link:'https://filemoon.to/d/ercrsideydgg/28_a_os_despu_s_mp4.mp4'},
  { id:'28semanasdespues', type:'movie', title:'28 semanas despues', year:2007, genre:'Terror', poster:'https://es.web.img2.acsta.net/r_1920_1080/medias/nmedia/18/89/50/99/20051366.jpg', link:'https://filemoon.to/d/cqpuueqy1v9b/28_semanas_despu_s_Castellano__2007_.mp4'},
  { id:'28diasdespues', type:'movie', title:'28 dias despues', year:2002, genre:'Terror', poster:'https://es.web.img2.acsta.net/r_1920_1080/medias/nmedia/18/79/49/98/19505162.jpg', link:'https://filemoon.to/d/0cyrzddgiqbg/28_Dias_despues_Castellano__2002_.mp4'},  
  { id:'dostumbas', type:'series', title:'Dos tumbas', year:2025, genre:'Drama', poster:'https://es.web.img3.acsta.net/r_1920_1080/img/ed/cb/edcbfa403b455f8e3f24a82f2b6b7937.jpg',
    seasons:[
      {season:1, episodes:[
        {title:'T1 · Ep1', link:'https://filemoon.to/d/ff7c64hjyjwn/Dos_tumbas_1x01_mp4.mp4'},
        {title:'T1 · Ep2', link:'https://filemoon.to/d/arptw94edhtr/Dos_tumbas_1x02_mp4.mp4'},
        {title:'T1 · Ep3', link:'https://filemoon.to/d/sijdtparoq8u/Dos_tumbas_1x03_mp4.mp4'}
      ]}
    ]
  },
   { id:'vacio', type:'series', title:'vacio', year:2025, genre:'Drama', poster:'https://i.ibb.co/FnGwW1c/Logo.png',
    seasons:[
      {season:1, episodes:[
        {title:'S1 · Ep1', link:'https://filemoon.link/bb11'},
        {title:'S1 · Ep2', link:'https://filemoon.link/bb12'},
        {title:'S1 · Ep3', link:'https://filemoon.link/bb13'},
        {title:'S1 · Ep4', link:'https://filemoon.link/bb14'},
        {title:'S1 · Ep5', link:'https://filemoon.link/bb15'},
        {title:'S1 · Ep6', link:'https://filemoon.link/bb16'},
        {title:'S1 · Ep7', link:'https://filemoon.link/bb17'},
        {title:'S1 · Ep8', link:'https://filemoon.link/bb18'}
      ]},
      {season:2, episodes:[
        {title:'S2 · Ep1', link:'https://filemoon.link/bb21'},
        {title:'S2 · Ep2', link:'https://filemoon.link/bb22'},
        {title:'S2 · Ep3', link:'https://filemoon.link/bb23'},
        {title:'S2 · Ep4', link:'https://filemoon.link/bb24'},
        {title:'S2 · Ep5', link:'https://filemoon.link/bb25'},
        {title:'S2 · Ep6', link:'https://filemoon.link/bb26'},
        {title:'S2 · Ep7', link:'https://filemoon.link/bb27'},
        {title:'S2 · Ep8', link:'https://filemoon.link/bb28'}
      ]}
    ]
  } 
];

// ===== Variables =====
let itemsPerPage = 15, currentPage = 1, filteredData = mediaData, focusIndex = 0;
let inModal = false, modalFocusedSeason = 0, modalFocusedEpisode = 0;
let currentSeries = null, activeSeasonIndex = 0;

// ===== Elementos =====
const gridEl = document.getElementById('grid');
const paginationEl = document.getElementById('pagination');
const searchEl = document.getElementById('search');
const filterEl = document.getElementById('filter');
const genreEl = document.getElementById('genre-filter');
const yearEl = document.getElementById('filterYear');
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modal-title');
const modalSub = document.getElementById('modal-sub');
const seasonsEl = document.getElementById('seasons');
const episodesEl = document.getElementById('episodes');
document.getElementById('modal-close').onclick = ()=>{ overlay.classList.remove('show'); inModal=false; setFocus(focusIndex); };

// ===== Funciones Grid =====
function renderGrid(list){
  filteredData=list;
  const totalPages=Math.ceil(list.length/itemsPerPage);
  if(currentPage>totalPages) currentPage=totalPages||1;
  const start=(currentPage-1)*itemsPerPage;
  const end=start+itemsPerPage;
  const pageItems=list.slice(start,end);
  gridEl.innerHTML='';
  if(!pageItems.length){ gridEl.innerHTML='<div style="color:var(--muted)">Sin resultados</div>'; paginationEl.innerHTML=''; return; }
  pageItems.forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='card'; div.tabIndex=0; div.dataset.index=i;
    div.innerHTML=`<img class="img" src="${item.poster}"><div class="info"><div class="title">${item.title}</div><div class="meta">${item.type} • ${item.year} • ${item.genre}</div></div>`;
    div.onclick=()=>item.type==='movie'?window.open(item.link,'_blank'):openSeriesModal(item);
    gridEl.appendChild(div);
  });
  renderPagination(Math.ceil(list.length/itemsPerPage));
  setFocus(focusIndex);
}

function renderPagination(totalPages){
  paginationEl.innerHTML='';
  for(let i=1;i<=totalPages;i++){
    const btn=document.createElement('button');
    btn.textContent=i;
    if(i===currentPage) btn.classList.add('active');
    btn.tabIndex=0;
    btn.onclick=()=>{ currentPage=i; renderGrid(filteredData); focusIndex=0; };
    paginationEl.appendChild(btn);
  }
}

// ===== Funciones Modal =====
function openSeriesModal(series){
  currentSeries = series;
  modalTitle.textContent = series.title;
  modalSub.textContent = 'Selecciona temporada y episodio';
  seasonsEl.innerHTML = ''; episodesEl.innerHTML = '';
  series.seasons.forEach((s,i)=>{
    const b=document.createElement('button'); b.className='season-btn'+(i===0?' active':''); b.tabIndex=0; b.textContent='T'+s.season;
    b.onclick=()=> setModalSeason(i);
    seasonsEl.appendChild(b);
  });
  setModalSeason(0);
  overlay.classList.add('show'); inModal=true;
}

function setModalSeason(seasonIdx){
  activeSeasonIndex=seasonIdx;
  modalFocusedSeason=seasonIdx;
  modalFocusedEpisode=0;
  document.querySelectorAll('.season-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.season-btn')[seasonIdx].classList.add('active');
  renderEpisodes();
  setModalFocus();
}

function renderEpisodes(){
  episodesEl.innerHTML='';
  currentSeries.seasons[activeSeasonIndex].episodes.forEach((ep,i)=>{
    const div=document.createElement('div'); div.className='episode-card'; div.tabIndex=0; div.dataset.index=i;
    div.innerHTML=`<div style="color:#fff;font-size:14px;font-weight:bold">${ep.title}</div><button class="play-btn">Ver episodio</button>`;
    div.querySelector('button').onclick=()=>window.open(ep.link,'_blank');
    episodesEl.appendChild(div);
  });
}

function setModalFocus(){
  const eps = episodesEl.querySelectorAll('.episode-card');
  eps.forEach(e=>e.classList.remove('focused'));
  if(eps[modalFocusedEpisode]) eps[modalFocusedEpisode].classList.add('focused');
}

// ===== Filtros =====
[...new Set(mediaData.map(i=>i.year))].sort((a,b)=>b-a).forEach(y=>{ const o=document.createElement('option'); o.value=y;o.textContent=y; yearEl.appendChild(o);});
function applyFilters(){
  const q=searchEl.value.toLowerCase(), type=filterEl.value, gen=genreEl.value, year=yearEl.value;
  const filtered = mediaData.filter(m=>
    (type==='all'||m.type===type)&&
    (gen==='all'||m.genre===gen)&&
    (!year||String(m.year)===year)&&
    (m.title.toLowerCase().includes(q))
  );
  currentPage=1; focusIndex=0;
  renderGrid(filtered);
}
searchEl.oninput=filterEl.onchange=genreEl.onchange=yearEl.onchange=applyFilters;

// ===== Navegación teclado =====
function setFocus(idx){ const cards=document.querySelectorAll('.card'); if(cards[idx]) cards[idx].focus(); }

document.addEventListener('keydown',e=>{
  if(inModal){
    const eps = episodesEl.querySelectorAll('.episode-card');
    if(e.key==='ArrowRight'){ modalFocusedEpisode=(modalFocusedEpisode+1)%eps.length; setModalFocus(); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ modalFocusedEpisode=(modalFocusedEpisode-1+eps.length)%eps.length; setModalFocus(); e.preventDefault(); }
    if(e.key==='ArrowUp'){ modalFocusedSeason=(modalFocusedSeason-1+currentSeries.seasons.length)%currentSeries.seasons.length; setModalSeason(modalFocusedSeason); e.preventDefault(); }
    if(e.key==='ArrowDown'){ modalFocusedSeason=(modalFocusedSeason+1)%currentSeries.seasons.length; setModalSeason(modalFocusedSeason); e.preventDefault(); }
    if(e.key==='Enter'){ const link=currentSeries.seasons[activeSeasonIndex].episodes[modalFocusedEpisode].link; window.open(link,'_blank'); e.preventDefault(); }
  } else {
    const cards=document.querySelectorAll('.card');
    if(cards.length===0) return;
    if(e.key==='ArrowRight'){ focusIndex=(focusIndex+1)%cards.length; setFocus(focusIndex); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ focusIndex=(focusIndex-1+cards.length)%cards.length; setFocus(focusIndex); e.preventDefault(); }
    if(e.key==='ArrowDown'){ currentPage++; renderGrid(filteredData); e.preventDefault(); }
    if(e.key==='ArrowUp'){ currentPage--; renderGrid(filteredData); e.preventDefault(); }
    if(e.key==='Enter'){ cards[focusIndex].click(); e.preventDefault(); }
  }
});

// ===== Inicializar =====
renderGrid(mediaData);
</script>

</body>
</html>
