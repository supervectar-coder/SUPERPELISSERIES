<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUPERVECTAR PELICULAS Y SERIES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Launcher SUPERVECTAR TV - Deportes, TV, Películas y Series">

<style>
:root {
    --bg: #ffffff;
    --primary: #0a3d62;
    --text: #111111;
    --btn: #f1f1f1;
    --btn-hover: #e0e0e0;
    --btn-text: #ff3b3b;
    --glow: rgba(255, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
}

.app-container {
    display: flex;
    flex-direction: column;
    text-align: center;
    height: 95vh;
    width: 95vw;
}

/* LOGO */
.logo {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    margin: 10px auto 5px;
    display: block;
    box-shadow: 0 0 15px var(--glow);
    animation: logoGlow 2s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from { box-shadow: 0 0 10px var(--glow); }
    to { box-shadow: 0 0 25px var(--glow); }
}

h1 {
    margin-top: 10px;
    font-size: 28px;
    font-weight: bold;
    color: var(--btn-text);
    text-shadow: 0 0 12px var(--glow);
    animation: neonTitle 2s ease-in-out infinite alternate;
}

@keyframes neonTitle {
    from { text-shadow: 0 0 12px var(--glow); }
    to { text-shadow: 0 0 25px var(--glow), 0 0 40px var(--glow); }
}

.icon-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
    padding: 20px;
}

.app-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    border-radius: 25px;
    font-size: 18px;
    color: var(--btn-text);
    background: var(--btn);
    font-weight: bold;
    text-decoration: none;
    transition: .25s;
    box-shadow: 0 0 10px #ccc;
    border: 1px solid #ddd;
}

.app-btn:hover, .app-btn:focus {
    background: var(--btn-hover);
    box-shadow: 0 0 12px var(--glow), 0 0 25px var(--glow);
    outline: none;
    transform: scale(1.05);
}

.app-btn:active {
    transform: scale(.92);
}

.icon {
    width: 48px;
    height: 48px;
    margin-bottom: 12px;
    border-radius: 12px;
}

:focus-visible {
    outline: 3px solid red;
    border-radius: 30px;
}

/* 📱 Móvil */
.mobile-ui .app-btn {
    padding: 20px;
    font-size: 16px;
}

/* 🖥️ PC */
.pc-ui .app-btn {
    padding: 40px;
    font-size: 22px;
}

/* 📺 TV */
.tv-ui .app-btn {
    padding: 35px;
    font-size: 24px;
}
</style>
</head>

<body>
<div class="app-container">

<img src="https://i.ibb.co/7dGjZb80/6.jpg" alt="Logo SUPERVECTAR" class="logo">

<h1>SUPERVECTAR PELICULAS Y SERIES</h1>


<div id="notice">
⚠️ SI ENTRAS DESDE ANDROID TV UTILIZA UN RATON DE ORDENADOR O LA FUNCION RATON DEL MANDO A DISTANCIA.
</div>

<div class="icon-grid">

<a class="app-btn" href="https://supervectar-coder.github.io/PELISPETICIONES/">
<img class="icon" src="https://i.ibb.co/mFVJhbqV/cinee.jpg"> SV PELIS (PETICIONES)
</a>

<a class="app-btn" href="https://www.socialcreator.com/20131971plmr/?s=74316">
<img class="icon" src="https://i.ibb.co/mFVJhbqV/cinee.jpg"> PELIS
</a>

<a class="app-btn" href="https://supervectar-coder.github.io/SERIESPETICIONES/">
<img class="icon" src="https://i.ibb.co/mFVJhbqV/cinee.jpg"> SV SERIES (PETICIONES)
</a>

<a class="app-btn" href="https://www.socialcreator.com/20131971sr2/?s=325193">
<img class="icon" src="https://i.ibb.co/mFVJhbqV/cinee.jpg"> SERIES
</a>


</div>
</div>

<script>
function detectDevice() {
    const ua = navigator.userAgent.toLowerCase();

    if (/tv|smart|tizen|webos|android tv/.test(ua)) {
        document.body.classList.add("tv-ui");
    } else if (/mobile|android|iphone/.test(ua)) {
        document.body.classList.add("mobile-ui");
    } else {
        document.body.classList.add("pc-ui");
    }
}
detectDevice();
</script>

</body>
</html>
